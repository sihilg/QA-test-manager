[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qa-test-manager-api"
version = "0.1.0"
description = "Local API for QA Test Manager"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.15,<2",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "openpyxl>=3.1,<4",
    "pwdlib[argon2]>=0.3,<1",
    "python-docx>=1.1,<2",
    "reportlab>=4.2,<5",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.15,<3",
    "pypdf>=5,<7",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
    "types-openpyxl>=3.1,<4",
    "types-reportlab>=4.4,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qa_test_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["qa_test_manager"]
mypy_path = "src"
